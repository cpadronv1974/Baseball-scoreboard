<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorecard · Hoja de Anotación de Béisbol</title>

<!-- ============================================================
     FUENTES — Oswald (display condensada, sporty) + JetBrains Mono (datos)
     Estética: vintage scorebook (papel crema, tintas rojo/marino),
     pero con UI moderna, compacta y de alto contraste para uso bajo el sol.
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Bitter:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   VARIABLES DE DISEÑO
============================================================ */
:root {
  --paper:        #F5EFE0;   /* fondo crema, reduce reflejo solar */
  --paper-dark:   #E8DFC8;   /* tablas, contraste sutil */
  --ink:          #0A0A0A;   /* tinta principal, máximo contraste */
  --ink-soft:     #3A3A3A;
  --red:          #B91C1C;   /* tinta roja del scorebook tradicional */
  --red-dark:     #7F1313;
  --navy:         #0A2240;   /* tinta azul marino */
  --navy-light:   #1E3A5F;
  --gold:         #C9A227;   /* acento (líneas de foul, oro vintage) */
  --green:        #15803D;
  --gray:         #B5AB94;   /* círculos vacíos del marcador */
  --gray-light:   #D8CFB7;
  --shadow:       0 2px 0 var(--ink);
  --border-thin:  1.5px solid var(--ink);
  --border-thick: 3px solid var(--ink);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Bitter', Georgia, serif;
  font-size: 14px;
  min-height: 100vh;
  /* Textura sutil de papel */
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0px, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0px, transparent 50%);
}

button { font-family: inherit; cursor: pointer; }
input  { font-family: inherit; }

/* ============================================================
   HEADER — Cabecera tipo programa de juego
============================================================ */
.header {
  background: var(--ink);
  color: var(--paper);
  padding: 14px 24px;
  border-bottom: 6px double var(--red);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 20px;
}
.header .title {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 28px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.header .title small {
  display: block;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--gold);
  font-weight: 500;
  margin-top: 2px;
}
.header .scoreboard {
  display: flex;
  align-items: center;
  gap: 18px;
  font-family: 'JetBrains Mono', monospace;
}
.header .team-score {
  text-align: center;
  min-width: 110px;
}
.header .team-score .tname {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  letter-spacing: 0.15em;
  color: var(--paper-dark);
  text-transform: uppercase;
  margin-bottom: 2px;
}
.header .team-score .tscore {
  font-size: 42px;
  font-weight: 700;
  line-height: 1;
  color: var(--paper);
}
.header .vs {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  color: var(--gold);
  font-weight: 600;
}
.header .meta {
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--paper-dark);
}
.header .meta .inning-now {
  display: inline-block;
  background: var(--red);
  color: var(--paper);
  font-family: 'Oswald', sans-serif;
  font-size: 18px;
  font-weight: 700;
  padding: 4px 12px;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  border: 2px solid var(--paper);
}

/* ============================================================
   LAYOUT PRINCIPAL — Grid de dos columnas
============================================================ */
.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 14px;
  padding: 14px;
  max-width: 1700px;
  margin: 0 auto;
}

/* ============================================================
   PANELES (cards)
============================================================ */
.panel {
  background: var(--paper);
  border: var(--border-thick);
  box-shadow: 4px 4px 0 var(--ink);
  margin-bottom: 14px;
}
.panel-header {
  background: var(--ink);
  color: var(--paper);
  padding: 8px 14px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 600;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-header .badge {
  background: var(--red);
  color: var(--paper);
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 8px;
  font-size: 11px;
  letter-spacing: 0.05em;
}
.panel-body { padding: 10px; }

/* ============================================================
   TABS DE EQUIPOS
============================================================ */
.tabs {
  display: flex;
  border-bottom: var(--border-thick);
  background: var(--paper-dark);
}
.tab {
  flex: 1;
  background: var(--paper-dark);
  border: none;
  border-right: var(--border-thin);
  padding: 12px 18px;
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  transition: all 0.15s;
}
.tab:last-child { border-right: none; }
.tab.active {
  background: var(--red);
  color: var(--paper);
}
.tab:hover:not(.active) { background: var(--gray-light); }

/* ============================================================
   META DEL JUEGO (fecha, sede, lanzadores)
============================================================ */
.meta-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 10px;
  background: var(--paper-dark);
  border-bottom: var(--border-thin);
}
.meta-field {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.meta-field label {
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 600;
}
.meta-field input {
  border: var(--border-thin);
  background: var(--paper);
  padding: 5px 8px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
}
.meta-field input:focus { outline: 2px solid var(--red); }

/* ============================================================
   SCORECARD — La matriz principal
============================================================ */
.scorecard-wrap {
  overflow-x: auto;
  border-top: var(--border-thin);
}
table.scorecard {
  border-collapse: collapse;
  width: 100%;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
table.scorecard th,
table.scorecard td {
  border: var(--border-thin);
  text-align: center;
  padding: 0;
  background: var(--paper);
}
table.scorecard thead th {
  background: var(--navy);
  color: var(--paper);
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 12px;
  padding: 6px 4px;
}
table.scorecard thead th.inn-th {
  background: var(--navy-light);
  width: 56px;
}
table.scorecard thead th.total {
  background: var(--red);
  width: 40px;
}

table.scorecard td.idx {
  background: var(--paper-dark);
  font-weight: 700;
  width: 28px;
}
table.scorecard td.pos {
  width: 42px;
}
table.scorecard td.pos input {
  width: 100%;
  border: none;
  background: transparent;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  padding: 6px 2px;
  font-size: 12px;
  color: var(--navy);
}
table.scorecard td.name { min-width: 170px; }
table.scorecard td.name input {
  width: 100%;
  border: none;
  background: transparent;
  padding: 6px 8px;
  font-family: 'Bitter', serif;
  font-size: 13px;
  font-weight: 500;
}
table.scorecard td.name input:focus,
table.scorecard td.pos input:focus {
  outline: 2px solid var(--red);
  background: #FFF8E0;
}

table.scorecard td.cell {
  width: 56px;
  height: 44px;
  position: relative;
  cursor: pointer;
  transition: background 0.1s;
}
table.scorecard td.cell:hover { background: #FFF8E0; }
table.scorecard td.cell.has-result { background: var(--paper-dark); }
table.scorecard td.cell .result-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.1;
}
table.scorecard td.cell.hit  .result-text { color: var(--red); }
table.scorecard td.cell.walk .result-text { color: var(--navy); }
table.scorecard td.cell.out  .result-text { color: var(--ink-soft); }
table.scorecard td.cell.error .result-text { color: var(--gold); }

/* Tira de totales R/H/E inferior */
table.scorecard tfoot td {
  background: var(--ink);
  color: var(--paper);
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 6px 2px;
  font-size: 13px;
}
table.scorecard tfoot td.label {
  background: var(--navy);
  text-align: right;
  padding-right: 10px;
  letter-spacing: 0.15em;
}
table.scorecard tfoot td.total { background: var(--red); }

/* ============================================================
   MODAL — Selector de resultado de turno al bate
============================================================ */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(2px);
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--paper);
  border: var(--border-thick);
  box-shadow: 6px 6px 0 var(--red);
  max-width: 540px;
  width: 90%;
  padding: 0;
}
.modal h3 {
  background: var(--ink);
  color: var(--paper);
  padding: 12px 18px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 16px;
}
.modal .modal-body { padding: 16px; }
.modal .info {
  font-size: 12px;
  margin-bottom: 12px;
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', monospace;
}
.modal .info strong { color: var(--ink); }
.result-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.result-btn {
  background: var(--paper);
  border: var(--border-thin);
  padding: 10px 4px;
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  letter-spacing: 0.05em;
  font-size: 13px;
  color: var(--ink);
  transition: all 0.1s;
}
.result-btn:hover {
  background: var(--gold);
  transform: translate(-1px, -1px);
  box-shadow: 2px 2px 0 var(--ink);
}
.result-btn.hit  { background: #FCE6E6; }
.result-btn.walk { background: #E0E8F4; }
.result-btn.out  { background: var(--gray-light); }
.result-btn.error { background: #FFF1D6; }

.modal .custom-row {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.modal .custom-row input {
  flex: 1;
  border: var(--border-thin);
  padding: 8px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}
.modal .custom-row button {
  background: var(--navy);
  color: var(--paper);
  border: var(--border-thin);
  padding: 0 18px;
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.modal-foot {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  justify-content: flex-end;
}
.modal-foot button {
  border: var(--border-thin);
  background: var(--paper);
  padding: 8px 16px;
  font-family: 'Oswald', sans-serif;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.modal-foot button.danger { background: var(--red); color: var(--paper); }

/* ============================================================
   PANEL DERECHO — Diamante, contadores, controles
============================================================ */
.right-col { display: flex; flex-direction: column; }

/* ---------- Diamante ---------- */
.diamond-wrap {
  position: relative;
  background: var(--paper);
  padding: 8px;
}
.diamond-svg { width: 100%; height: auto; display: block; }

/* ---------- Indicadores B/S/O ---------- */
.indicators {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 12px;
  background: var(--paper-dark);
  border-top: var(--border-thin);
  border-bottom: var(--border-thin);
}
.ind {
  text-align: center;
}
.ind-label {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-weight: 700;
}
.lights {
  display: flex;
  gap: 5px;
  justify-content: center;
}
.light {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--gray);
  border: 2px solid var(--ink);
  transition: background 0.1s;
}
.light.on-ball   { background: #16A34A; }
.light.on-strike { background: #FACC15; }
.light.on-out    { background: var(--red); }

/* ---------- Botones de pitcheo ---------- */
.pitch-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 10px;
  border-bottom: var(--border-thin);
}
.pitch-btn {
  padding: 12px 8px;
  border: var(--border-thin);
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 14px;
  transition: all 0.1s;
}
.pitch-btn.ball   { background: #DCFCE7; color: var(--ink); }
.pitch-btn.strike { background: #FEF3C7; color: var(--ink); }
.pitch-btn.foul   { background: #FED7AA; color: var(--ink); }
.pitch-btn.reset  { background: var(--paper-dark); color: var(--ink); }
.pitch-btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: 2px 2px 0 var(--ink);
}
.pitch-btn:active { transform: translate(1px, 1px); box-shadow: none; }

/* ---------- Pitch count ---------- */
.pitch-count {
  padding: 10px;
  background: var(--ink);
  color: var(--paper);
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.pitch-count .label {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--gold);
  margin-bottom: 4px;
}
.pitch-count .num {
  font-size: 30px;
  font-weight: 700;
  line-height: 1;
}

/* ---------- Bateador actual ---------- */
.current-batter {
  padding: 10px 12px;
  background: var(--red);
  color: var(--paper);
  border-top: var(--border-thin);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.current-batter .lbl {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.85;
}
.current-batter .name {
  font-family: 'Oswald', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

/* ---------- Controles globales ---------- */
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px;
}
.ctrl-btn {
  background: var(--paper);
  border: var(--border-thin);
  padding: 10px;
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 12px;
  transition: all 0.1s;
}
.ctrl-btn:hover {
  background: var(--gold);
  transform: translate(-1px, -1px);
  box-shadow: 2px 2px 0 var(--ink);
}
.ctrl-btn.primary { background: var(--navy); color: var(--paper); }
.ctrl-btn.danger { background: var(--red); color: var(--paper); }
.ctrl-btn.full { grid-column: 1 / -1; }

/* ============================================================
   RESUMEN R/H/E POR INNING (línea bajo de la pantalla)
============================================================ */
.rhe-summary {
  margin-top: 10px;
}
table.rhe {
  width: 100%;
  border-collapse: collapse;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}
table.rhe th, table.rhe td {
  border: var(--border-thin);
  text-align: center;
  padding: 7px 4px;
}
table.rhe th {
  background: var(--navy);
  color: var(--paper);
  font-family: 'Oswald', sans-serif;
  letter-spacing: 0.08em;
}
table.rhe td.team-name {
  background: var(--paper-dark);
  text-align: left;
  padding-left: 12px;
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
table.rhe td.total {
  background: var(--ink);
  color: var(--paper);
  font-weight: 700;
}

/* ============================================================
   DIAMANTE — bases interactivas
============================================================ */
.base {
  cursor: pointer;
  transition: fill 0.15s;
}
.base.occupied { fill: var(--red); }
.base-label {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  fill: var(--ink);
  pointer-events: none;
  text-anchor: middle;
}
.runner-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  fill: var(--paper);
  pointer-events: none;
  text-anchor: middle;
}

/* ============================================================
   RESUMEN FINAL (exportación)
============================================================ */
.export-modal {
  max-width: 720px;
  width: 95%;
}
.export-content {
  padding: 20px;
  max-height: 70vh;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  background: #FFFBEF;
}

/* ============================================================
   Responsive — colapsar layout en pantallas pequeñas
============================================================ */
@media (max-width: 1100px) {
  .main { grid-template-columns: 1fr; }
  .right-col { order: -1; }
}
</style>
</head>

<body>

<!-- ============================================================
     HEADER GLOBAL — Marcador en vivo y datos del juego
============================================================ -->
<header class="header">
  <div class="title">
    Scorecard
    <small>Hoja de Anotación Digital</small>
  </div>

  <div class="scoreboard">
    <div class="team-score">
      <div class="tname" id="hdrVisitorName">Visitante</div>
      <div class="tscore" id="hdrVisitorScore">0</div>
    </div>
    <div class="vs">·</div>
    <div class="team-score">
      <div class="tname" id="hdrHomeName">Local</div>
      <div class="tscore" id="hdrHomeScore">0</div>
    </div>
  </div>

  <div class="meta">
    <div class="inning-now" id="hdrInning">▲ 1°</div>
    <div id="hdrDate">—</div>
  </div>
</header>

<!-- ============================================================
     LAYOUT PRINCIPAL — Scorecard + Panel de control
============================================================ -->
<div class="main">

  <!-- ============== Columna IZQUIERDA: Scorecards ============== -->
  <div class="left-col">

    <!-- Tabs para alternar entre equipos -->
    <div class="panel" style="padding:0; overflow:hidden;">
      <div class="tabs">
        <button class="tab active" data-team="visitor" onclick="switchTab('visitor')">▲ Visitante</button>
        <button class="tab" data-team="home" onclick="switchTab('home')">▼ Local</button>
      </div>

      <!-- Datos meta de cada equipo: nombre, lanzador, etc. -->
      <div class="meta-bar">
        <div class="meta-field">
          <label>Equipo</label>
          <input type="text" id="teamNameInput" placeholder="Nombre del equipo">
        </div>
        <div class="meta-field">
          <label>Lanzador Rival</label>
          <input type="text" id="opposingPitcherInput" placeholder="Pitcher contrario">
        </div>
        <div class="meta-field">
          <label>Fecha</label>
          <input type="date" id="gameDateInput">
        </div>
        <div class="meta-field">
          <label>Sede</label>
          <input type="text" id="venueInput" placeholder="Estadio / Ciudad">
        </div>
      </div>

      <!-- Matriz de anotación: filas = bateadores, columnas = innings -->
      <div class="scorecard-wrap">
        <table class="scorecard" id="scorecardTable">
          <!-- generado por JS -->
        </table>
      </div>
    </div>

    <!-- Resumen R/H/E por inning (ambos equipos) -->
    <div class="panel rhe-summary">
      <div class="panel-header">
        Resumen R/H/E
        <span class="badge" id="gameStatusBadge">EN JUEGO</span>
      </div>
      <div class="panel-body" style="padding:0;">
        <table class="rhe" id="rheTable">
          <!-- generado por JS -->
        </table>
      </div>
    </div>
  </div>

  <!-- ============== Columna DERECHA: Diamante + Controles ============== -->
  <div class="right-col">

    <!-- Diamante interactivo -->
    <div class="panel">
      <div class="panel-header">
        Diamante en Vivo
        <span class="badge" id="basesBadge">Bases vacías</span>
      </div>
      <div class="diamond-wrap">
        <svg class="diamond-svg" viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">

          <!-- Fondo del campo: tierra y pasto -->
          <rect width="300" height="280" fill="#F5EFE0"/>

          <!-- Pasto (área del campo interno) -->
          <path d="M 150 250 L 250 150 L 150 50 L 50 150 Z"
                fill="#86C26F" stroke="#0A0A0A" stroke-width="2"/>

          <!-- Tierra del cuadro -->
          <path d="M 150 230 L 230 150 L 150 70 L 70 150 Z"
                fill="#C9A27D" stroke="#0A0A0A" stroke-width="1.5"/>

<!-- ============================================================
     LÓGICA — JavaScript
============================================================ -->
<script>
/* ===============================================================
   ESTADO GLOBAL DEL JUEGO
   Se persiste íntegramente en localStorage en cada cambio.
=============================================================== */
const STORAGE_KEY = 'baseball_scorecard_v1';

// Estado inicial vacío del juego
function emptyTeam(name) {
  return {
    name: name,
    opposingPitcher: '',
    // 9 bateadores: objeto con nombre y posición (1=P, 2=C, 3=1B, ..., 9=RF, DH=DH)
    players: Array.from({length: 9}, () => ({ name: '', pos: '' })),
    // Matriz 9 jugadores × 9 innings — cada celda es el código del resultado
    scorecard: Array.from({length: 9}, () => Array(9).fill('')),
    // Estadísticas por inning
    runs:   Array(9).fill(0),
    hits:   Array(9).fill(0),
    errors: Array(9).fill(0),
    // Pitcheos del lanzador actual del equipo CONTRARIO (registrados aquí cuando este equipo batea)
    pitchCount: 0,
    strikeTotal: 0,
    // Índice del bateador actual (0-8)
    batterIndex: 0
  };
}

let state = {
  meta: {
    date: new Date().toISOString().slice(0,10),
    venue: ''
  },
  teams: {
    visitor: emptyTeam('Visitante'),
    home:    emptyTeam('Local')
  },
  // Estado del juego en vivo
  game: {
    inning: 1,        // 1-9 (puede extenderse con extras)
    half: 'top',      // 'top' = bate visitante, 'bot' = bate local
    balls: 0,
    strikes: 0,
    outs: 0,
    // Corredores: cada base guarda el nombre del jugador o null
    bases: { 1: null, 2: null, 3: null }
  },
  ui: {
    activeTab: 'visitor',     // qué scorecard se muestra
    editingCell: null         // { team, playerIdx, inningIdx }
  },
  finalized: false
};

/* ===============================================================
   PERSISTENCIA LOCAL — Guardar/cargar de localStorage
=============================================================== */
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('No se pudo guardar:', e);
  }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const loaded = JSON.parse(raw);
    // Fusión defensiva: solo asignamos propiedades válidas
    if (loaded && loaded.teams && loaded.game) {
      state = loaded;
      return true;
    }
  } catch (e) {
    console.warn('No se pudo cargar:', e);
  }
  return false;
}

function saveNow() {
  save();
  flash('Guardado ✓');
}

/* ===============================================================
   UTILIDADES DE CLASIFICACIÓN
   Cada código de resultado se categoriza para alimentar las
   estadísticas (R/H/E) y los contadores automáticos.
=============================================================== */
const HITS  = ['1B','2B','3B','HR'];
const WALKS = ['BB','HBP'];
const OUTS  = ['K','Kc','F7','F8','F9','G6-3','G4-3','G1-3','G5-3','G5','G4','G3','FC','SAC','DP','POP','GO','FO'];

function classify(code) {
  if (!code) return 'empty';
  const c = code.trim().toUpperCase();
  if (HITS.includes(c)) return 'hit';
  if (WALKS.includes(c)) return 'walk';
  if (c === 'E' || c.startsWith('E-')) return 'error';
  if (OUTS.includes(c) || c.startsWith('K') || c.startsWith('G') || c.startsWith('F') || c.startsWith('OUT')) return 'out';
  if (c === 'SB' || c === 'CS') return 'baserun';
  return 'other';
}

// ¿Cuántas bases avanza el bateador con el código?
function basesFromHit(code) {
  switch ((code||'').toUpperCase()) {
    case '1B': case 'BB': case 'HBP': case 'E': case 'FC': return 1;
    case '2B': return 2;
    case '3B': return 3;
    case 'HR': return 4;
    default: return 0;
  }
}

/* ===============================================================
   SCORECARD — Construcción dinámica de la tabla principal
=============================================================== */
function buildScorecard() {
  const tbl = document.getElementById('scorecardTable');
  const team = state.teams[state.ui.activeTab];

  let html = `
    <thead>
      <tr>
        <th>#</th>
        <th>Pos</th>
        <th>Jugador</th>`;
  for (let i = 1; i <= 9; i++) html += `<th class="inn-th">${i}</th>`;
  html += `<th class="total">R</th><th class="total">H</th></tr></thead><tbody>`;

  team.players.forEach((p, pi) => {
    html += `<tr>
      <td class="idx">${pi + 1}</td>
      <td class="pos"><input type="text" maxlength="3" value="${escapeAttr(p.pos)}"
            onchange="updatePos(${pi}, this.value)" placeholder="Pos"></td>
      <td class="name"><input type="text" value="${escapeAttr(p.name)}"
            onchange="updatePlayerName(${pi}, this.value)" placeholder="Nombre del jugador"></td>`;

    for (let inn = 0; inn < 9; inn++) {
      const result = team.scorecard[pi][inn];
      const cls = classify(result);
      html += `<td class="cell ${cls === 'empty' ? '' : 'has-result ' + cls}"
                   onclick="openResultModal(${pi}, ${inn})">
                <span class="result-text">${escapeHtml(result)}</span>
              </td>`;
    }

    // Totales por jugador
    const playerRuns = countPlayerRuns(team, pi);
    const playerHits = countPlayerHits(team, pi);
    html += `<td style="background:var(--paper-dark); font-weight:700;">${playerRuns}</td>
             <td style="background:var(--paper-dark); font-weight:700;">${playerHits}</td>`;
    html += `</tr>`;
  });

  // Fila de TOTAL por inning
  html += `</tbody><tfoot>
    <tr><td colspan="3" class="label">Carreras</td>`;
  let totR = 0;
  for (let i = 0; i < 9; i++) {
    totR += team.runs[i];
    html += `<td>${team.runs[i] || 0}</td>`;
  }
  html += `<td class="total">${totR}</td><td class="total">—</td></tr>`;

  html += `<tr><td colspan="3" class="label">Hits</td>`;
  let totH = 0;
  for (let i = 0; i < 9; i++) {
    totH += team.hits[i];
    html += `<td>${team.hits[i] || 0}</td>`;
  }
  html += `<td class="total">—</td><td class="total">${totH}</td></tr>`;

  html += `</tfoot>`;
  tbl.innerHTML = html;
}

// Helpers para escapar HTML/atributos
function escapeHtml(s) { return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s) { return String(s||'').replace(/"/g, '&quot;'); }

// Cuenta carreras anotadas por un jugador (aproximación: HR cuentan automáticamente;
// las demás carreras se anotan al cruzar home — ver runner logic).
function countPlayerHits(team, pi) {
  return team.scorecard[pi].filter(r => classify(r) === 'hit').length;
}
function countPlayerRuns(team, pi) {
  // Marca interna: si el resultado tiene un sufijo "·R" lo contamos como carrera anotada
  // Además, todo HR es una carrera segura del bateador.
  return team.scorecard[pi].filter(r => /·R$/.test(r) || (r||'').toUpperCase() === 'HR').length;
}

/* ===============================================================
   ACTUALIZACIÓN DE JUGADORES (nombre / posición)
=============================================================== */
function updatePlayerName(idx, val) {
  state.teams[state.ui.activeTab].players[idx].name = val;
  save();
  renderHeader();
  renderCurrentBatter();
}
function updatePos(idx, val) {
  state.teams[state.ui.activeTab].players[idx].pos = val;
  save();
}

/* ===============================================================
   META BAR — Inputs del equipo (nombre, fecha, sede, etc.)
=============================================================== */
function bindMetaInputs() {
  const team = state.teams[state.ui.activeTab];
  document.getElementById('teamNameInput').value        = team.name || '';
  document.getElementById('opposingPitcherInput').value = team.opposingPitcher || '';
  document.getElementById('gameDateInput').value        = state.meta.date || '';
  document.getElementById('venueInput').value           = state.meta.venue || '';

  document.getElementById('teamNameInput').oninput = (e) => {
    state.teams[state.ui.activeTab].name = e.target.value;
    save(); renderHeader();
    // Actualiza también el texto del tab
    document.querySelector(`.tab[data-team="${state.ui.activeTab}"]`)
      .innerHTML = (state.ui.activeTab === 'visitor' ? '▲ ' : '▼ ') + (e.target.value || (state.ui.activeTab === 'visitor' ? 'Visitante' : 'Local'));
  };
  document.getElementById('opposingPitcherInput').oninput = (e) => {
    state.teams[state.ui.activeTab].opposingPitcher = e.target.value;
    save();
  };
  document.getElementById('gameDateInput').oninput = (e) => {
    state.meta.date = e.target.value; save(); renderHeader();
  };
  document.getElementById('venueInput').oninput = (e) => {
    state.meta.venue = e.target.value; save();
  };
}

/* ===============================================================
   TABS — Alternar entre equipo visitante y local
=============================================================== */
function switchTab(team) {
  state.ui.activeTab = team;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.team === team));
  render();
  save();
}

/* ===============================================================
   MODAL: Asignar resultado a una celda del scorecard
=============================================================== */
function openResultModal(playerIdx, inningIdx) {
  state.ui.editingCell = { team: state.ui.activeTab, playerIdx, inningIdx };
  const team = state.teams[state.ui.activeTab];
  document.getElementById('modalBatter').textContent = team.players[playerIdx].name || `Bateador ${playerIdx + 1}`;
  document.getElementById('modalInning').textContent = `${inningIdx + 1}°`;
  document.getElementById('customResult').value = team.scorecard[playerIdx][inningIdx] || '';
  document.getElementById('resultModal').classList.add('show');
}
function closeModal() {
  document.getElementById('resultModal').classList.remove('show');
  state.ui.editingCell = null;
}

/**
 * setResult — Asigna un código de resultado a la celda activa
 * y actualiza automáticamente:
 *   - hits/errores/outs del inning
 *   - bases ocupadas (avance del bateador)
 *   - cuenta de bolas/strikes (la resetea)
 *   - bateador actual (avanza al siguiente)
 */
function setResult(code) {
  const e = state.ui.editingCell;
  if (!e) return;
  const team = state.teams[e.team];
  const prev = team.scorecard[e.playerIdx][e.inningIdx];
  const prevCls = classify(prev);

  // Si había un resultado previo, revertir su efecto en stats
  if (prev) {
    if (prevCls === 'hit')   team.hits[e.inningIdx]   = Math.max(0, team.hits[e.inningIdx] - 1);
    if (prevCls === 'error') team.errors[e.inningIdx] = Math.max(0, team.errors[e.inningIdx] - 1);
    if (/·R$/.test(prev) || prev.toUpperCase() === 'HR') {
      team.runs[e.inningIdx] = Math.max(0, team.runs[e.inningIdx] - (prev.toUpperCase() === 'HR' ? 1 : 1));
    }
  }

  team.scorecard[e.playerIdx][e.inningIdx] = code;
  const cls = classify(code);

  // Stats automáticas según el nuevo código
  if (cls === 'hit')   team.hits[e.inningIdx]++;
  if (cls === 'error') team.errors[e.inningIdx]++;

  // HR: corre automáticamente todas las bases, anota la carrera del bateador
  // y de todos los corredores en base.
  if (code === 'HR') {
    const batterName = team.players[e.playerIdx].name || `Bat. ${e.playerIdx + 1}`;
    // Cada corredor en base anota
    let runnersScored = 0;
    [3, 2, 1].forEach(b => { if (state.game.bases[b]) { runnersScored++; state.game.bases[b] = null; } });
    team.runs[e.inningIdx] += (1 + runnersScored); // batter + runners
    // Marca esta celda con "·R" para reflejar la carrera del bateador
    team.scorecard[e.playerIdx][e.inningIdx] = 'HR';
  }
  // Avance normal de bases con hits, BB, HBP o E
  else if (['1B','BB','HBP','E','FC'].includes(code)) {
    advanceRunners(1, team.players[e.playerIdx].name || `Bat. ${e.playerIdx+1}`, team, e.inningIdx);
  }
  else if (code === '2B') {
    advanceRunners(2, team.players[e.playerIdx].name || `Bat. ${e.playerIdx+1}`, team, e.inningIdx);
  }
  else if (code === '3B') {
    advanceRunners(3, team.players[e.playerIdx].name || `Bat. ${e.playerIdx+1}`, team, e.inningIdx);
  }

  // Outs automáticos
  if (cls === 'out') {
    state.game.outs++;
    if (code === 'DP') state.game.outs++; // doble play = 2 outs
    if (state.game.outs >= 3) {
      autoChangeHalf();
    } else {
      advanceBatterAuto(team);
    }
  } else if (cls === 'hit' || cls === 'walk' || cls === 'error') {
    advanceBatterAuto(team);
  }

  // Reset cuenta de bolas/strikes en todo turno completado
  state.game.balls = 0;
  state.game.strikes = 0;

  closeModal();
  save();
  render();
}

function setCustomResult() {
  const val = document.getElementById('customResult').value.trim();
  if (val) setResult(val);
}

/* ===============================================================
   AVANCE DE CORREDORES
   advanceRunners(n, batterName, team, inning):
     - Mueve a cada corredor `n` bases.
     - Si un corredor cruza home, suma carrera al inning y marca al
       jugador correspondiente con sufijo "·R".
     - El bateador se coloca en la base correspondiente.
=============================================================== */
function advanceRunners(nBases, batterName, team, inningIdx) {
  // Procesamos de 3B hacia 1B para no pisar slots
  for (let b = 3; b >= 1; b--) {
    if (state.game.bases[b]) {
      const newBase = b + nBases;
      if (newBase >= 4) {
        // Corredor anota
        team.runs[inningIdx]++;
        scoreRunByName(state.game.bases[b], inningIdx);
        state.game.bases[b] = null;
      } else {
        state.game.bases[newBase] = state.game.bases[b];
        state.game.bases[b] = null;
      }
    }
  }
  // Colocar al bateador
  if (nBases >= 4) {
    team.runs[inningIdx]++;
    scoreRunByName(batterName, inningIdx);
  } else {
    state.game.bases[nBases] = batterName;
  }
}

/**
 * Marca la carrera en el scorecard del jugador que anotó:
 * busca su última entrada no vacía en este inning y le agrega "·R".
 */
function scoreRunByName(name, inningIdx) {
  const team = state.teams[state.ui.activeTab];
  // Buscamos el jugador por nombre
  for (let i = 0; i < 9; i++) {
    if (team.players[i].name === name) {
      const cell = team.scorecard[i][inningIdx];
      if (cell && !/·R$/.test(cell)) {
        team.scorecard[i][inningIdx] = cell + '·R';
      }
      break;
    }
  }
}

/* ===============================================================
   PITCHEOS — Bola, Strike, Foul
   - Bola 4 → BB automático para el bateador actual
   - Strike 3 → K automático
   - Foul incrementa strike solo si <2
=============================================================== */
function addPitch(type) {
  const team = state.teams[state.ui.activeTab];
  team.pitchCount++;
  if (type === 'ball') {
    state.game.balls++;
    if (state.game.balls >= 4) {
      autoSetResult('BB');
      return;
    }
  } else if (type === 'strike') {
    state.game.strikes++;
    team.strikeTotal++;
    if (state.game.strikes >= 3) {
      autoSetResult('K');
      return;
    }
  } else if (type === 'foul') {
    if (state.game.strikes < 2) state.game.strikes++;
    team.strikeTotal++;
  }
  save();
  render();
}

function autoSetResult(code) {
  const team = state.teams[state.ui.activeTab];
  state.ui.editingCell = {
    team: state.ui.activeTab,
    playerIdx: team.batterIndex,
    inningIdx: state.game.inning - 1
  };
  setResult(code);
}

function resetCount() {
  state.game.balls = 0;
  state.game.strikes = 0;
  save();
  render();
}

/* ===============================================================
   OUTS Y CAMBIO DE ENTRADA
=============================================================== */
function addOut() {
  state.game.outs++;
  if (state.game.outs >= 3) autoChangeHalf();
  else advanceBatterAuto(state.teams[state.ui.activeTab]);
  state.game.balls = 0; state.game.strikes = 0;
  save();
  render();
}

function advanceBatterAuto(team) {
  team.batterIndex = (team.batterIndex + 1) % 9;
}

function autoChangeHalf() {
  // 3 outs → cambio de mitad
  changeHalf();
}

function changeHalf() {
  if (state.game.half === 'top') {
    state.game.half = 'bot';
    state.ui.activeTab = 'home';
  } else {
    state.game.half = 'top';
    state.game.inning++;
    state.ui.activeTab = 'visitor';
  }
  state.game.outs = 0;
  state.game.balls = 0;
  state.game.strikes = 0;
  clearBases(true);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.team === state.ui.activeTab));
  save();
  render();
}

/* ===============================================================
   DIAMANTE INTERACTIVO
=============================================================== */
function toggleBase(b) {
  if (state.game.bases[b]) {
    // Si ya hay corredor, lo quitamos (out o se fue)
    if (confirm(`¿Quitar al corredor "${state.game.bases[b]}" de ${b}B?`)) {
      state.game.bases[b] = null;
    }
  } else {
    const name = prompt(`Nombre del corredor en ${b}B:`, '');
    if (name) state.game.bases[b] = name.trim();
  }
  save();
  render();
}

function clearBases(silent) {
  if (!silent && !confirm('¿Limpiar todas las bases?')) return;
  state.game.bases = { 1: null, 2: null, 3: null };
  save();
  render();
}

/* ===============================================================
   RENDER — Pintar todo el estado en la UI
=============================================================== */
function render() {
  buildScorecard();
  bindMetaInputs();
  renderDiamond();
  renderIndicators();
  renderPitchCount();
  renderHeader();
  renderRHE();
  renderCurrentBatter();
}

function renderDiamond() {
  // Cambiar relleno de cada base según ocupación
  for (let b = 1; b <= 3; b++) {
    const baseGroup = document.getElementById('base' + b);
    const rect = baseGroup.querySelector('.base-shape');
    const txt  = document.getElementById('runner' + b);
    if (state.game.bases[b]) {
      rect.setAttribute('fill', '#B91C1C');
      const n = state.game.bases[b];
      txt.textContent = n.length > 8 ? n.slice(0,8) + '…' : n;
    } else {
      rect.setAttribute('fill', '#FFFFFF');
      txt.textContent = '—';
    }
  }
  const occ = Object.values(state.game.bases).filter(Boolean).length;
  document.getElementById('basesBadge').textContent =
    occ === 0 ? 'Bases vacías' : occ + (occ === 1 ? ' corredor' : ' corredores');
}

function renderIndicators() {
  const ballC   = document.getElementById('ballLights');
  const strikeC = document.getElementById('strikeLights');
  const outC    = document.getElementById('outLights');

  ballC.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div');
    d.className = 'light' + (i < state.game.balls ? ' on-ball' : '');
    ballC.appendChild(d);
  }
  strikeC.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'light' + (i < state.game.strikes ? ' on-strike' : '');
    strikeC.appendChild(d);
  }
  outC.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'light' + (i < state.game.outs ? ' on-out' : '');
    outC.appendChild(d);
  }
}

function renderPitchCount() {
  // Mostramos el pitcheo del lanzador rival mientras este equipo batea
  const team = state.teams[state.ui.activeTab];
  document.getElementById('pitchCount').textContent  = team.pitchCount;
  document.getElementById('strikeTotal').textContent = team.strikeTotal;
}

function renderHeader() {
  document.getElementById('hdrVisitorName').textContent  = state.teams.visitor.name || 'Visitante';
  document.getElementById('hdrHomeName').textContent     = state.teams.home.name    || 'Local';
  document.getElementById('hdrVisitorScore').textContent = totalRuns(state.teams.visitor);
  document.getElementById('hdrHomeScore').textContent    = totalRuns(state.teams.home);
  document.getElementById('hdrInning').textContent =
    (state.game.half === 'top' ? '▲ ' : '▼ ') + state.game.inning + '°';
  document.getElementById('hdrDate').textContent = state.meta.date || '—';
}

function totalRuns(team) {
  return team.runs.reduce((a,b) => a + (b||0), 0);
}
function totalHits(team) {
  return team.hits.reduce((a,b) => a + (b||0), 0);
}
function totalErrors(team) {
  return team.errors.reduce((a,b) => a + (b||0), 0);
}

function renderRHE() {
  const tbl = document.getElementById('rheTable');
  let html = `<thead><tr><th style="text-align:left;padding-left:12px;">Equipo</th>`;
  for (let i = 1; i <= 9; i++) html += `<th>${i}</th>`;
  html += `<th>R</th><th>H</th><th>E</th></tr></thead><tbody>`;

  ['visitor','home'].forEach(t => {
    const team = state.teams[t];
    html += `<tr><td class="team-name">${escapeHtml(team.name)}</td>`;
    for (let i = 0; i < 9; i++) {
      html += `<td>${team.runs[i] || 0}</td>`;
    }
    html += `<td class="total">${totalRuns(team)}</td>
             <td class="total">${totalHits(team)}</td>
             <td class="total">${totalErrors(team)}</td></tr>`;
    // Fila secundaria de hits
    html += `<tr><td class="team-name" style="font-size:10px; color:var(--ink-soft);">↳ Hits</td>`;
    for (let i = 0; i < 9; i++) {
      html += `<td style="font-size:11px; color:var(--ink-soft);">${team.hits[i] || 0}</td>`;
    }
    html += `<td colspan="3" style="background:var(--paper-dark);"></td></tr>`;
  });

  html += `</tbody>`;
  tbl.innerHTML = html;
}

function renderCurrentBatter() {
  const team = state.teams[state.ui.activeTab];
  const batter = team.players[team.batterIndex];
  document.getElementById('currentBatterName').textContent = batter.name || `Bateador ${team.batterIndex + 1}`;
  document.getElementById('currentBatterOrder').textContent = (team.batterIndex + 1) + '°';
}

/* ===============================================================
   FINALIZAR JUEGO — Generar resumen y exportar
=============================================================== */
function finalizeGame() {
  if (!confirm('¿Finalizar el juego y generar el resumen?')) return;
  state.finalized = true;
  document.getElementById('gameStatusBadge').textContent = 'FINALIZADO';
  save();
  showExport();
}

function generateSummary() {
  const v = state.teams.visitor;
  const h = state.teams.home;
  const vR = totalRuns(v), hR = totalRuns(h);
  const vH = totalHits(v), hH = totalHits(h);
  const vE = totalErrors(v), hE = totalErrors(h);

  let winner = 'Empate';
  if (vR > hR) winner = v.name + ' gana';
  else if (hR > vR) winner = h.name + ' gana';

  let out = '';
  out += '═══════════════════════════════════════════════════\n';
  out += '         HOJA DE ANOTACIÓN — RESUMEN OFICIAL       \n';
  out += '═══════════════════════════════════════════════════\n\n';
  out += `Fecha:    ${state.meta.date || '—'}\n`;
  out += `Sede:     ${state.meta.venue || '—'}\n`;
  out += `Resultado: ${v.name} ${vR}  —  ${hR} ${h.name}\n`;
  out += `→ ${winner}\n\n`;

  // R/H/E por inning
  out += 'MARCADOR R/H/E POR INNING\n';
  out += '─────────────────────────────────────────────────\n';
  out += '         '.padEnd(20);
  for (let i = 1; i <= 9; i++) out += ('I' + i).padStart(4);
  out += '   R   H   E\n';

  [v, h].forEach(team => {
    out += (team.name || '—').padEnd(20).slice(0,20);
    for (let i = 0; i < 9; i++) out += String(team.runs[i] || 0).padStart(4);
    out += String(totalRuns(team)).padStart(4);
    out += String(totalHits(team)).padStart(4);
    out += String(totalErrors(team)).padStart(4);
    out += '\n';
  });
  out += '\n';

  // Lineup y scorecard por equipo
  [v, h].forEach(team => {
    out += `\nLINEUP — ${team.name}\n`;
    out += '─────────────────────────────────────────────────\n';
    out += '#  Pos  Jugador              ';
    for (let i = 1; i <= 9; i++) out += ('I' + i).padEnd(7);
    out += '\n';
    team.players.forEach((p, pi) => {
      out += String(pi + 1).padEnd(3);
      out += (p.pos || '—').padEnd(5);
      out += (p.name || '—').padEnd(22).slice(0,22);
      for (let i = 0; i < 9; i++) {
        out += (team.scorecard[pi][i] || '—').padEnd(7).slice(0,7);
      }
      out += '\n';
    });
    out += `Pitcheos recibidos del rival: ${team.pitchCount} (${team.strikeTotal} strikes)\n`;
  });

  out += '\n═══════════════════════════════════════════════════\n';
  out += `Generado: ${new Date().toLocaleString('es-MX')}\n`;
  return out;
}

function showExport() {
  document.getElementById('exportContent').textContent = generateSummary();
  document.getElementById('exportModal').classList.add('show');
}

function downloadSummary() {
  const txt = generateSummary();
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `scorecard_${state.meta.date || 'juego'}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copySummary() {
  navigator.clipboard.writeText(generateSummary())
    .then(() => flash('Copiado al portapapeles ✓'))
    .catch(() => alert('No se pudo copiar.'));
}

/* ===============================================================
   RESET — Borrar todo el juego
=============================================================== */
function resetGame() {
  if (!confirm('Esto borrará TODO el juego actual. ¿Continuar?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = {
    meta: { date: new Date().toISOString().slice(0,10), venue: '' },
    teams: { visitor: emptyTeam('Visitante'), home: emptyTeam('Local') },
    game: { inning: 1, half: 'top', balls: 0, strikes: 0, outs: 0, bases: {1:null,2:null,3:null} },
    ui: { activeTab: 'visitor', editingCell: null },
    finalized: false
  };
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.team === 'visitor'));
  document.getElementById('gameStatusBadge').textContent = 'EN JUEGO';
  render();
}

/* ===============================================================
   UTILIDAD — Mensaje flash temporal
=============================================================== */
function flash(msg) {
  let el = document.getElementById('flashMsg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'flashMsg';
    el.style.cssText = `
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--paper); padding: 12px 24px;
      font-family: 'Oswald', sans-serif; letter-spacing: 0.1em;
      text-transform: uppercase; z-index: 1000; box-shadow: 4px 4px 0 var(--red);
      border: 2px solid var(--paper); font-weight: 600; font-size: 13px;
      transition: opacity 0.3s;
    `;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1500);
}

/* ===============================================================
   INICIALIZACIÓN
=============================================================== */
function init() {
  const restored = load();
  // Si estábamos en un tab válido, restaurarlo
  if (restored) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.team === state.ui.activeTab));
    if (state.finalized) document.getElementById('gameStatusBadge').textContent = 'FINALIZADO';
  }
  render();

  // Atajos de teclado para anotar rápido
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'b') addPitch('ball');
    else if (e.key === 's') addPitch('strike');
    else if (e.key === 'f') addPitch('foul');
    else if (e.key === 'o') addOut();
    else if (e.key === 'Escape') closeModal();
  });

  // Cerrar modales al clickear fondo
  document.getElementById('resultModal').addEventListener('click', (e) => {
    if (e.target.id === 'resultModal') closeModal();
  });
  document.getElementById('exportModal').addEventListener('click', (e) => {
    if (e.target.id === 'exportModal') e.target.classList.remove('show');
  });
}

// Arrancar cuando el DOM esté listo
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
