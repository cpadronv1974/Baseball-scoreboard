<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay Simple</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700;800&family=Barlow+Condensed:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;width:100vw;height:100vh}

/* ── BARRA INFERIOR estilo ESPN ── */
#sb{
  position:absolute;
  bottom:60px;
  left:0;
  font-family:'Oswald',sans-serif;
  filter:drop-shadow(0 -2px 12px rgba(0,0,0,0.9));
  display:flex;
  align-items:stretch;
  height:68px;
}

/* Equipo visitante */
.team-block{
  display:flex;align-items:center;gap:10px;
  padding:0 16px;min-width:180px;
}
.team-block.away{background:linear-gradient(90deg,#1a1a2e,#16213e)}
.team-block.home{background:linear-gradient(90deg,#16213e,#1a1a2e)}
.team-abbr{font-size:1.5rem;font-weight:800;letter-spacing:2px;color:#fff;line-height:1}
.team-runs{font-size:2.2rem;font-weight:800;color:#fff;line-height:1;min-width:32px;text-align:center}
.team-runs.lead{color:#e8b84b}

/* Divider vertical */
.v-div{width:3px;background:#e8b84b;flex-shrink:0}

/* Panel central — entrada + bases + conteo */
.center-panel{
  background:#0d0d1c;
  display:flex;align-items:center;gap:0;
}

/* Entrada */
.inn-block{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 14px;border-right:1px solid rgba(255,255,255,0.08);height:100%;
}
.inn-arrow{font-size:0.7rem;color:#e8b84b;line-height:1}
.inn-num{font-size:1.8rem;font-weight:800;color:#e8b84b;line-height:1}

/* Bases */
.bases-block{
  display:flex;align-items:center;justify-content:center;
  padding:0 12px;border-right:1px solid rgba(255,255,255,0.08);height:100%;
}
.diamond{width:44px;height:44px;position:relative;flex-shrink:0}
.base{width:14px;height:14px;border:2px solid #333;background:#1a1a2e;position:absolute;transform:rotate(45deg);transition:all 0.12s}
.base.occ{background:#e8b84b;border-color:#e8b84b;box-shadow:0 0 8px rgba(232,184,75,0.8)}
.base-2{top:0;left:50%;transform:translateX(-50%) rotate(45deg)}
.base-3{bottom:8px;left:2px;transform:rotate(45deg)}
.base-1{bottom:8px;right:2px;transform:rotate(45deg)}

/* BSO + Lanzamientos */
.bso-block{
  display:flex;flex-direction:column;justify-content:center;
  padding:0 12px;border-right:1px solid rgba(255,255,255,0.08);height:100%;gap:5px;
}
.bso-row{display:flex;align-items:center;gap:5px}
.bso-lbl{font-family:'Barlow Condensed',sans-serif;font-size:0.55rem;letter-spacing:2px;color:#555;width:10px}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #333;background:transparent;transition:all 0.1s}
.dot.ball{background:#4b8fe8;border-color:#4b8fe8;box-shadow:0 0 4px rgba(75,143,232,0.7)}
.dot.strike{background:#e8b84b;border-color:#e8b84b;box-shadow:0 0 4px rgba(232,184,75,0.7)}
.dot.out{background:#e74c3c;border-color:#e74c3c;box-shadow:0 0 4px rgba(231,76,60,0.7)}

/* Pitcher lanzamientos */
.pitch-block{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 14px;height:100%;
}
.pitch-num{font-size:1.6rem;font-weight:800;color:#fff;line-height:1}
.pitch-lbl{font-family:'Barlow Condensed',sans-serif;font-size:0.5rem;letter-spacing:2px;color:#555;margin-top:1px}

/* Status badge */
.status-strip{
  position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  background:#e8b84b;color:#000;
  font-size:0.5rem;font-weight:700;letter-spacing:3px;
  padding:3px 12px;border-radius:4px 4px 0 0;
  font-family:'Barlow Condensed',sans-serif;white-space:nowrap;
}

#conn{position:fixed;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#2ecc71;opacity:0.7}
#conn.off{background:#e74c3c}
</style>
</head>
<body>

<div id="sb">
  <!-- STATUS -->
  <div class="status-strip" id="status">EN JUEGO</div>

  <!-- VISITANTE -->
  <div class="team-block away">
    <div>
      <div style="font-size:0.5rem;letter-spacing:3px;color:rgba(255,255,255,0.4);margin-bottom:2px">VISIT.</div>
      <div class="team-abbr" id="away-name">VIS</div>
    </div>
    <div class="team-runs" id="away-score">0</div>
  </div>

  <div class="v-div"></div>

  <!-- LOCAL -->
  <div class="team-block home">
    <div class="team-runs" id="home-score">0</div>
    <div>
      <div style="font-size:0.5rem;letter-spacing:3px;color:rgba(255,255,255,0.4);margin-bottom:2px">LOCAL</div>
      <div class="team-abbr" id="home-name">LOC</div>
    </div>
  </div>

  <div class="v-div"></div>

  <!-- CENTRO -->
  <div class="center-panel">

    <!-- Entrada -->
    <div class="inn-block">
      <div class="inn-arrow" id="inn-half">▲</div>
      <div class="inn-num" id="inn-num">1</div>
    </div>

    <!-- Bases -->
    <div class="bases-block">
      <div class="diamond">
        <div class="base base-2" id="base-2"></div>
        <div class="base base-3" id="base-3"></div>
        <div class="base base-1" id="base-1"></div>
      </div>
    </div>

    <!-- BSO -->
    <div class="bso-block">
      <div class="bso-row">
        <span class="bso-lbl">B</span>
        <div class="dots">
          <div class="dot" id="b0"></div><div class="dot" id="b1"></div>
          <div class="dot" id="b2"></div><div class="dot" id="b3"></div>
        </div>
      </div>
      <div class="bso-row">
        <span class="bso-lbl">S</span>
        <div class="dots">
          <div class="dot" id="s0"></div><div class="dot" id="s1"></div>
        </div>
      </div>
      <div class="bso-row">
        <span class="bso-lbl">O</span>
        <div class="dots">
          <div class="dot" id="o0"></div><div class="dot" id="o1"></div>
        </div>
      </div>
    </div>

    <!-- Lanzamientos -->
    <div class="pitch-block">
      <div class="pitch-num" id="pitches">0</div>
      <div class="pitch-lbl">P</div>
    </div>

  </div>
</div>

<div id="conn" class="off"></div>

<script>
const SERVER='https://baseball-scoreboard.onrender.com';
function render(s){
  document.getElementById('away-name').textContent=(s.away.name||'VIS').substring(0,4).toUpperCase();
  document.getElementById('home-name').textContent=(s.home.name||'LOC').substring(0,4).toUpperCase();
  const ar=s.away.r,hr=s.home.r;
  const as=document.getElementById('away-score'),hs=document.getElementById('home-score');
  as.textContent=ar;hs.textContent=hr;
  as.className='team-runs'+(ar>hr?' lead':'');
  hs.className='team-runs'+(hr>ar?' lead':'');
  document.getElementById('inn-num').textContent=s.inning;
  document.getElementById('inn-half').textContent=s.half==='top'?'▲':'▼';
  document.getElementById('status').textContent=s.status||'EN JUEGO';
  ['b0','b1','b2','b3'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.className='dot'+(i<s.balls?' ball':'')});
  ['s0','s1'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.className='dot'+(i<s.strikes?' strike':'')});
  ['o0','o1'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.className='dot'+(i<s.outs?' out':'')});
  [1,2,3].forEach(n=>{const el=document.getElementById('base-'+n);if(el)el.className='base base-'+['1','2','3'][n-1]+(s.bases[n-1]?' occ':'')});
  document.getElementById('pitches').textContent=s.pitches||0;
}
async function poll(){
  try{
    const r=await fetch(SERVER+'/state',{mode:'cors'});
    if(r.ok){render(await r.json());document.getElementById('conn').className='';}
  }catch(e){document.getElementById('conn').className='off';}
}
setInterval(poll,1000);poll();
</script>
</body>
</html>
